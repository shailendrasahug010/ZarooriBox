# Netlify settings for the ZarooriBox website. Netlify reads this file, so the
# site needs no manual build settings: connect the GitHub repo and deploy.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Every app page is served by index.html (the app picks the screen).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Always check for a new app version, so updates reach people straight away.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Built files have content hashes in their names, so they can be cached for good.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
