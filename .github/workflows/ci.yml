name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Server functions (type check + tests)
        run: |
          deno check --node-modules-dir=auto supabase/functions/*/index.ts
          deno test --node-modules-dir=auto --allow-env supabase/functions/_shared/
