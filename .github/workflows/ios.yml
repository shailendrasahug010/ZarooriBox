name: iOS app

# Checks that the iPhone app compiles (simulator build, no signing).
# Run it from the Actions tab. To install on a real iPhone, open ios/App in Xcode
# on a Mac and run it with your Apple developer account (see README).

on:
  workflow_dispatch:

jobs:
  simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for the iOS simulator
        working-directory: ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40; exit ${PIPESTATUS[0]}
