name: iOS TestFlight

# Builds the signed iPhone app and uploads it to App Store Connect, where it
# shows up in TestFlight. Run it from the Actions tab. Signing is managed by
# Apple through an App Store Connect API key, so no certificate files are
# needed. Repository secrets (see docs/store-setup.md, Apple section):
#   APPLE_TEAM_ID     your 10-character Apple Developer team ID
#   ASC_KEY_ID        the App Store Connect API key ID
#   ASC_ISSUER_ID     the issuer ID shown above the keys list
#   ASC_KEY_P8        the whole .p8 key file, including the BEGIN/END lines
# The key needs the Admin role so Xcode can create the signing certificate.

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    env:
      HAS_APPLE: ${{ secrets.ASC_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - name: Check the Apple keys are set up
        if: env.HAS_APPLE != 'true'
        run: |
          echo "::error::Add the APPLE_TEAM_ID and ASC_* secrets first (docs/store-setup.md, Apple step 4)."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Write the API key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/asc/AuthKey.p8"
      - name: Archive
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/ZarooriBox.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive | tail -30; exit ${PIPESTATUS[0]}
      - name: Upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ZarooriBox.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" | tail -30; exit ${PIPESTATUS[0]}
      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
