name: Android app

# Builds an installable ZarooriBox APK on every push to main.
# Download it from the run's "Artifacts" section (zaroori-android-debug).
# The app connects to the Supabase project in .env.production.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: zaroori-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # TEMPORARY: check the release signing path with a throwaway key.
      - name: Release signing check
        working-directory: android
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/t.jks" -alias upload -keyalg RSA -keysize 2048 -validity 2 -storepass testpass1 -keypass testpass1 -dname "CN=Test"
          ZAROORI_UPLOAD_KEYSTORE="$RUNNER_TEMP/t.jks" ZAROORI_UPLOAD_STORE_PASSWORD=testpass1 ZAROORI_UPLOAD_KEY_ALIAS=upload ZAROORI_UPLOAD_KEY_PASSWORD=testpass1 ./gradlew bundleRelease assembleRelease --no-daemon
          ls -la app/build/outputs/bundle/release app/build/outputs/apk/release
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tail -1
