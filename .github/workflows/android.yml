name: Android app

# Builds an installable LifeBox APK on every push to main.
# Download it from the run's "Artifacts" section (lifebox-android-debug).
# To point the app at your Supabase project, add repository secrets
# VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY; without them the app stores
# everything on the phone.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lifebox-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
