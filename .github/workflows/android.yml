name: Android app

# Builds an installable LifeBox APK on every push to main.
# Download it from the run's "Artifacts" section (lifebox-android-debug).
# The app connects to the Supabase project in .env.production.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lifebox-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
